name: auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  auto-merge:
    uses: mdn/workflows/.github/workflows/auto-merge.yml@main
    if: github.repository_owner == 'mdn'
    with:
      auto-merge: true
    secrets:
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
