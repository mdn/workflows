name: auto-merge

on:
  workflow_call:
    inputs:
      auto-approve:
        description: Approve eligible pull requests (no breaking changes, no maintainer changes)
        default: true
        required: false
        type: boolean
      auto-merge:
        description: Merge eligible pull requests (when all required checks pass)
        default: false
        required: false
        type: boolean
      target-repo:
        description: |
          (Deprecated) This input is deprecated and will be removed soon. Remove it from your workflow, or it will start failing silently. To prevent fork execution, add this to your job instead: if: github.repository_owner == 'your-org'"
        required: false
        type: string
    secrets:
      GH_TOKEN:
        description: "Personal access token passed from the caller workflow"
        required: true

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Warn on deprecated inputs
        if: inputs.target-repo != ''
        run: |
          echo "::warning::The 'target-repo' input is deprecated and will be removed soon. Remove it from your workflow, or it will start failing silently. To prevent fork execution, add this to your job instead: if: github.repository_owner == 'your-org'"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Check for breaking change
        id: check
        env:
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
          PREV_VERSION: ${{ steps.dependabot-metadata.outputs.previous-version }}
          MAINTAINER_CHANGES: ${{ steps.dependabot-metadata.outputs.maintainer-changes }}
        run: |
          eligible=true

          # Major updates are breaking
          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            eligible=false
          # For 0.x versions, minor updates are breaking (semver spec)
          elif [[ "$PREV_VERSION" == 0.* && "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
            eligible=false
          # For 0.0.x versions, patch updates are breaking (semver spec)
          elif [[ "$PREV_VERSION" == 0.0.* && "$UPDATE_TYPE" == "version-update:semver-patch" ]]; then
            eligible=false
          # Package maintainers changed between versions
          elif [[ "$MAINTAINER_CHANGES" == "true" ]]; then
            eligible=false
          fi

          echo "eligible=$eligible" >> $GITHUB_OUTPUT

      - name: Approve
        if: inputs.auto-approve && steps.check.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh pr review ${{ github.event.pull_request.html_url }} --approve

      - name: Enable auto-merge
        if: inputs.auto-merge && steps.check.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.html_url }} --auto --squash
