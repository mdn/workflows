name: needs-triage

on:
  workflow_call:
    inputs:
      label:
        description: The label to add to the issue.
        default: "needs triage"
        required: false
        type: string

permissions:
  issues: write

jobs:
  needs-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Add label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LABEL: ${{ inputs.label }}
        with:
          script: |
            const { action, issue, changes } = context.payload;
            const label = process.env.LABEL;

            if (["opened", "reopened", "transferred"].includes(action)) {
              let triggeredAt;

              if (action === "transferred") {
                triggeredAt = Date.parse(changes.new_issue.updated_at);
              } else if (action === "opened" && changes?.old_issue == null) {
                triggeredAt = Date.parse(issue.created_at);
              } else {
                triggeredAt = Date.parse(issue.updated_at);
              }

              if (Number.isNaN(triggeredAt)) {
                throw new Error("Could not determine the triggering event timestamp.");
              }

              const events = await github.paginate(
                github.rest.issues.listEvents,
                {
                  ...context.repo,
                  issue_number: issue.number,
                  per_page: 100,
                },
              );

              const removedAfterTrigger = events.some(
                (event) =>
                  event.event === "unlabeled" &&
                  event.label?.name?.toLowerCase() === label.toLowerCase() &&
                  Date.parse(event.created_at) > triggeredAt,
              );

              if (removedAfterTrigger) {
                core.info("Skipping label because it was removed after the triggering event.");
                return;
              }
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: [label],
            });
